name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запустить вручную кнопкой на GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create placeholder icon (векторный drawable)
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_mesh_notification.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,2L22,12L12,22L2,12Z"/>
          </vector>
          EOF

      - name: Create launcher icons
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dpi
            # Простейший placeholder PNG через Python
            python3 -c "
          import struct, zlib
          def make_png(size):
              def chunk(name, data):
                  c = struct.pack('>I', len(data)) + name + data
                  return c + struct.pack('>I', zlib.crc32(c[4:]) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(size):
                  raw += b'\x00'
                  for x in range(size):
                      cx, cy = x - size//2, y - size//2
                      r = (cx*cx + cy*cy)**0.5
                      if r < size*0.4:
                          raw += bytes([0x21, 0x96, 0xF3])
                      else:
                          raw += bytes([0xFF, 0xFF, 0xFF])
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          import sys
          d = sys.argv[1]
          s = sizes[d]
          open(f'app/src/main/res/mipmap-{d}/ic_launcher.png','wb').write(make_png(s))
          open(f'app/src/main/res/mipmap-{d}/ic_launcher_round.png','wb').write(make_png(s))
          " $dpi
          done

      - name: Create themes.xml
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Mesh51" parent="Theme.MaterialComponents.DayNight.DarkActionBar"/>
          </resources>
          EOF

      - name: Create placeholder MainActivity (чтобы проект компилировался)
        run: |
          mkdir -p app/src/main/java/com/mesh51/app/ui
          cat > app/src/main/java/com/mesh51/app/ui/MainActivity.kt << 'EOF'
          package com.mesh51.app.ui

          import androidx.appcompat.app.AppCompatActivity
          import android.os.Bundle

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic51-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30  # APK хранится 30 дней
