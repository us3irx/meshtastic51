name: Build APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
 
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.2 --distribution-type=bin
          chmod +x gradlew
 
      - name: Create all required files
        run: |
          # gradle.properties
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
 
          # settings.gradle (перезаписываем на случай если там что-то другое)
          cat > settings.gradle << 'EOF'
          rootProject.name = "Meshtastic51"
          include ':app'
          EOF
 
          # root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                  classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
 
          # app/build.gradle (перезаписываем полностью)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'com.google.protobuf'
          }
          android {
              compileSdkVersion 34
              namespace 'com.mesh51.app'
              defaultConfig {
                  applicationId "com.mesh51.app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "0.1.0"
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              buildFeatures {
                  viewBinding true
                  buildConfig true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              sourceSets {
                  main {
                      proto { srcDir 'src/main/proto' }
                  }
              }
          }
          protobuf {
              protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }
              generateProtoTasks {
                  all().each { task ->
                      task.builtins { java { option 'lite' } }
                  }
              }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              annotationProcessor 'androidx.room:room-compiler:2.6.1'
              implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'org.osmdroid:osmdroid-android:6.1.18'
              implementation 'com.jakewharton.timber:timber:5.0.1'
          }
          EOF
 
          echo "Gradle files created"
 
      - name: Create res files
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_mesh_notification.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M12,2L22,12L12,22L2,12Z"/>
          </vector>
          EOF
 
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Mesh51" parent="Theme.MaterialComponents.DayNight.DarkActionBar"/>
          </resources>
          EOF
 
          # Launcher icons через Python
          python3 - << 'PYEOF'
          import struct, zlib, os
          def make_png(size):
              def chunk(name, data):
                  c = struct.pack('>I', len(data)) + name + data
                  return c + struct.pack('>I', zlib.crc32(c[4:]) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(size):
                  raw += b'\x00'
                  for x in range(size):
                      cx, cy = x - size//2, y - size//2
                      r = (cx*cx + cy*cy)**0.5
                      raw += bytes([0x21, 0x96, 0xF3] if r < size*0.4 else [0xFF, 0xFF, 0xFF])
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          for dpi, s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              d = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(d, exist_ok=True)
              png = make_png(s)
              open(f'{d}/ic_launcher.png','wb').write(png)
              open(f'{d}/ic_launcher_round.png','wb').write(png)
          print("Icons OK")
          PYEOF
 
      - name: Create placeholder MainActivity
        run: |
          mkdir -p app/src/main/java/com/mesh51/app/ui
          cat > app/src/main/java/com/mesh51/app/ui/MainActivity.kt << 'EOF'
          package com.mesh51.app.ui
          import androidx.appcompat.app.AppCompatActivity
          import android.os.Bundle
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
 
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic51-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
