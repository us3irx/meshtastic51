name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.2 --distribution-type=bin
          chmod +x gradlew

      - name: Create gradle files
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "Meshtastic51"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                  classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'com.google.protobuf'
          }
          android {
              compileSdkVersion 34
              namespace 'com.mesh51.app'
              defaultConfig {
                  applicationId "com.mesh51.app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "0.1.0"
                  multiDexEnabled true
              }
              buildTypes { release { minifyEnabled false } }
              buildFeatures { viewBinding true; buildConfig true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
              sourceSets { main { proto { srcDir 'src/main/proto' } } }
          }
          protobuf {
              protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }
              generateProtoTasks { all().each { task -> task.builtins { java { option 'lite' } } } }
          }
          dependencies {
              def kotlin_version = '1.9.22'
              implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              annotationProcessor 'androidx.room:room-compiler:2.6.1'
              implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'org.osmdroid:osmdroid-android:6.1.18'
              implementation 'com.jakewharton.timber:timber:5.0.1'
          }
          EOF

      - name: Deploy all source files and icons
        run: python3 -c "import base64,os; exec(base64.b64decode('').decode())"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic51-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
